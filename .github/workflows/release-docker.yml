name: "Release: docker"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.1.7)'
        required: true
  push:
    tags:
      - 'v*.*.*'

permissions:
  packages: write
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker meta
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: |
            schmiddim/alertmanager2es
            ghcr.io/schmiddim/alertmanager2es

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm,linux/arm64,linux/ppc64le
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Docker Images

            **DockerHub:**
            ```
            docker pull schmiddim/alertmanager2es:${{ github.ref_name }}
            ```

            **GitHub Container Registry:**
            ```
            docker pull ghcr.io/schmiddim/alertmanager2es:${{ github.ref_name }}
            ```

            **Platforms:** `linux/amd64`, `linux/arm`, `linux/arm64`, `linux/ppc64le`
